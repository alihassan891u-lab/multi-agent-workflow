<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Agent Console{% endblock %}</title>
<style>
  :root{--bg:#f7f7fa;--panel:#fff;--ink:#18181b;--muted:#71717a;--line:#e4e4e7;--brand:#7c3aed;--soft:#f3e8ff;
        --amber:#b45309;--amber-soft:#fef3c7;--green:#047857;--green-soft:#d1fae5;--red:#b91c1c;--red-soft:#fee2e2;--gray-soft:#f4f4f5}
  *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  .top{display:flex;align-items:center;gap:22px;padding:14px 28px;background:#18181b;color:#fff}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}.logo i{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;font-style:normal}
  .top a{color:#d4d4d8;text-decoration:none;font-weight:500}.top .r{margin-left:auto;font-size:12px;color:#a1a1aa}
  .wrap{padding:24px 28px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
  h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;display:inline-block;white-space:nowrap}
  .b-approve{background:var(--amber-soft);color:var(--amber)}.b-sent{background:var(--green-soft);color:var(--green)}
  .b-arch{background:var(--gray-soft);color:var(--muted)}.b-rej{background:var(--red-soft);color:var(--red)}
  .b-hot{background:var(--soft);color:var(--brand)}.b-warm{background:#e0f2fe;color:#0369a1}.b-low{background:var(--gray-soft);color:var(--muted)}
  .mono{font-family:'DejaVu Sans Mono',monospace;font-size:12px}
  button{font:inherit;font-weight:600;border-radius:10px;padding:10px 18px;border:1px solid var(--line);background:#fff;cursor:pointer}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="top"><div class="logo"><i>⬡</i>Lead Agents</div><a href="/">Inbox</a><span class="r">6 agents · human approval before send</span></div>
<div class="wrap">{% block body %}{% endblock %}</div>
</body>
</html>
